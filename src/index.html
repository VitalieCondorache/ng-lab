<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Angular Lab — Signals, Patterns &amp; Performance</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive reference for modern Angular: signals, functional patterns and performance techniques you can play with and copy."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Angular Lab — signals, patterns &amp; performance" />
    <meta
      property="og:description"
      content="An interactive reference for modern Angular: signals, functional patterns and performance techniques you can play with and copy."
    />
    <!-- Add an og:image once a screenshot lives in /public -->
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before the first paint to avoid a flash of the wrong palette.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('ng-lab-theme');
        } catch (e) {
          /* storage can be blocked; fall back to the system preference */
        }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
