<header class="topbar">
  <a class="topbar__brand" routerLink="/">
    <span class="topbar__mark" aria-hidden="true">ng</span>
    <span class="topbar__titles">
      <strong>Angular Lab</strong>
      <span class="topbar__sub muted">signals · patterns · performance</span>
    </span>
  </a>

  <div class="topbar__actions">
    <a class="topbar__link" href="https://github.com/" target="_blank" rel="noopener"> Source </a>
    <button
      type="button"
      class="topbar__theme"
      (click)="theme.toggle()"
      [attr.aria-pressed]="theme.current() === 'dark'"
      [attr.aria-label]="
        theme.current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
    >
      @if (theme.current() === 'dark') {
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" />
        </svg>
      }
    </button>
  </div>
</header>
