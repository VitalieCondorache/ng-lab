<div class="code">
  <div class="code__bar">
    <span class="code__label">{{ label() || language() }}</span>
    <button type="button" class="code__copy" (click)="copy()">
      {{ copied() ? 'Copied' : 'Copy' }}
    </button>
  </div>
  <pre><code class="hljs" [innerHTML]="markup()"></code></pre>
</div>
